# FunItems — настройки кастомных предметов
# Цвета: символ & (например &6 — золотой)

messages:
  prefix: "&8[&6FunItems&8] &f"
  cooldown: "&cПодождите ещё &e%s &cсек."
  no-permission: "&cНет прав."
  given: "&aВыдано: &f%s &ax%d &aигроку &f%s"
  reloaded: "&aКонфиг перезагружен."
  unknown-item: "&cТакого предмета нет. Список: /funitems list"
  player-not-found: "&cИгрок не найден."

